application:
  name: RAG PDF Chatbot
  environment: development

llm:
  provider: ollama
  model: qwen2.5:3b
  temperature: 0.0

embeddings:
  provider: local
  model: sentence-transformers/all-MiniLM-L6-v2

retrieval:
  top_k: 6

chunking:
  chunk_size: 1000
  chunk_overlap: 150

paths:
  uploads: data/uploads
  vectorstore: data/vectorstore